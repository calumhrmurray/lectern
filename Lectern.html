      </section>

      <section>
        <div class="kicker">Layout</div>
        <h2>Two columns, one figure.</h2>

          </div>

          <p>The first of two stacked slides.</p>

`,bt=[{id:"whale-evolution",title:"From land to sea — the evolutionary pathways of whales",description:"15 referenced slides in the Aquarelle theme: raoellids, Pakicetus, Ambulocetus, protocetids, basilosaurids, the Neoceti split, echolocation, gigantism, genomics.",lang:"en",files:["index.html","theme.css"]},{id:"naturalisation-fr",title:"Préparer l'entretien de naturalisation",description:"17 diapositives en français : cadre juridique, déroulement, symboles, valeurs, institutions, histoire, droits et devoirs — sources sur chaque diapositive.",lang:"fr",files:["index.html","theme.css"]}],yt={examples:bt},wt=`<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>From land to sea — the evolutionary pathways of whales</title>
  <meta name="description" content="A referenced overview of cetacean evolution, from raoellids and Pakicetus to baleen-whale gigantism.">
  <meta name="references" content="See the final slide and the data-ref attribute on each section; full citations in the speaker notes.">
  <link rel="stylesheet" href="../../reveal/dist/reset.css">
  <link rel="stylesheet" href="../../reveal/dist/reveal.css">

</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="wc-edge"><feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="3" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="22" xChannelSelector="R" yChannelSelector="G"/></filter>
  </svg>
  <div class="reveal">
    <div class="slides">

      <!-- 1 · title -->
      <section class="title-slide" data-ref="Uhen 2010; Thewissen et al. 2009">
        <div class="wash deep" style="left:-120px;top:60px;width:560px;height:420px;"></div>
        <div class="wash light" style="left:760px;top:-80px;width:620px;height:520px;"></div>
        <div class="wash warm" style="left:980px;top:520px;width:320px;height:220px;"></div>
        <svg class="whale-art" viewBox="0 0 400 160" width="560" height="224" style="position:absolute;left:700px;top:400px;" aria-label="Stylised baleen whale silhouette">
          <path d="M14,84 C36,58 110,44 200,52 C260,58 300,66 336,72 C350,74 356,76 360,80 C356,84 350,86 336,88 C300,98 250,110 190,112 C110,114 40,104 14,84 Z" fill="#1d4f74"/>
          <path d="M356,80 C372,66 396,60 398,66 C388,72 378,78 372,80 C378,82 388,88 398,94 C396,100 372,94 356,80 Z" fill="#1d4f74"/>
          <path d="M270,66 C284,54 300,52 306,58 C296,62 286,68 278,72 Z" fill="#1d4f74"/>
          <path d="M150,110 C162,126 186,130 202,120 C186,118 168,114 150,110 Z" fill="#1d4f74"/>
          <circle cx="48" cy="78" r="3.5" fill="#eef4f8"/>
        </svg>
        <h1>From land to sea.</h1>
        <p class="sub">The evolutionary pathways of whales</p>
        <p class="meta"><b>Cetacean evolution</b> in nine transitions · ~53 million years<br><span class="soft">Every slide carries its sources in the speaker notes (press S) and in <code>data-ref</code>.</span></p>
        <aside class="notes">
          Overview sources: Uhen, M.D. (2010) "The origin(s) of whales", Annual Review of Earth and Planetary Sciences 38:189–219.
          Thewissen, J.G.M., Cooper, L.N., George, J.C. &amp; Bajpai, S. (2009) "From land to water: the origin of whales, dolphins, and porpoises", Evolution: Education and Outreach 2:272–288.
          Marx, F.G., Lambert, O. &amp; Uhen, M.D. (2016) Cetacean Paleobiology, Wiley-Blackwell.
        </aside>
      </section>

      <!-- 2 · where whales sit -->
      <section data-ref="Nikaido, Rooney & Okada 1999 PNAS 96:10261; Gatesy 1997 MBE 14:537; Gingerich et al. 2001 Science 293:2239">
        <div class="wash light" style="left:900px;top:420px;width:420px;height:320px;"></div>
        <div class="kicker">Where whales sit on the tree of life</div>
        <h2>Whales are even-toed ungulates. Their closest living relatives are hippos.</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li>Cetaceans nest <strong>inside Artiodactyla</strong> (pigs, camels, ruminants, hippos) — hence the name <span class="accent">Cetartiodactyla</span>.</li>
              <li>Molecular evidence: shared <strong>SINE retroposon insertions</strong> found only in whales and hippos (Nikaido et al. 1999) — near-irreversible markers of common ancestry.</li>
              <li>Fossil confirmation: early whales <em>Rodhocetus</em> and <em>Artiocetus</em> have the artiodactyl <strong>double-pulley astragalus</strong> (ankle bone) (Gingerich et al. 2001).</li>
              <li>The whale + hippo clade is called <span class="accent">Whippomorpha</span>.</li>
            </ul>
          </div>
          <div class="col">
            <svg viewBox="0 0 520 300" width="520" height="300" aria-label="Cladogram: within Artiodactyla, hippos are the sister group of cetaceans" style="font-family:inherit">
              <g stroke="#1d4f74" stroke-width="3" fill="none" stroke-linecap="round">
                <path d="M40,150 H120"/>
                <path d="M120,150 V60 H200"/>
                <path d="M120,150 V240 H200"/>
                <path d="M200,60 V30 H300"/>
                <path d="M200,60 V95 H300"/>
                <path d="M200,240 V180 H300"/>
                <path d="M200,240 V270 H300"/>
                <path d="M300,180 V150 H400"/>
                <path d="M300,180 V210 H400"/>
              </g>
              <g font-size="18" fill="#17303f">
                <text x="308" y="36">camels</text>
                <text x="308" y="101">pigs</text>
                <text x="308" y="276">ruminants</text>
                <text x="408" y="156">hippos</text>
                <text x="408" y="216" font-weight="700" fill="#2f6f9f">whales</text>
              </g>
              <text x="330" y="245" font-size="14" fill="#4f6b7d" font-style="italic">Whippomorpha</text>
              <text x="40" y="138" font-size="14" fill="#4f6b7d">Artiodactyla</text>
            </svg>
            <p class="caption">Simplified; branch lengths not to scale.</p>
          </div>
        </div>
        <aside class="notes">
          Nikaido, M., Rooney, A.P. &amp; Okada, N. (1999) "Phylogenetic relationships among cetartiodactyls based on insertions of short and long interspersed elements: hippopotamuses are the closest extant relatives of whales", PNAS 96:10261–10266.
          Gatesy, J. (1997) "More DNA support for a Cetacea/Hippopotamidae clade", Molecular Biology and Evolution 14:537–543.
          Gingerich, P.D., ul Haq, M., Zalmout, I.S., Khan, I.H. &amp; Malkani, M.S. (2001) "Origin of whales from early artiodactyls: hands and feet of Eocene Protocetidae from Pakistan", Science 293:2239–2242.
        </aside>
      </section>

      <!-- 3 · timeline -->
      <section data-ref="Uhen 2010; Marx, Lambert & Uhen 2016; Slater, Goldbogen & Pyenson 2017">
        <div class="kicker">Fifty-three million years in one line</div>
        <h2>The transition happened fast: from wading to fully marine in about ten million years.</h2>
        <svg viewBox="0 0 1200 380" width="1200" height="380" aria-label="Timeline of cetacean evolution from 53 million years ago to the present; the Eocene is stretched for legibility" style="font-family:inherit">
          <defs>
            <linearGradient id="tl" x1="0" x2="1"><stop offset="0" stop-color="#8ec1e0"/><stop offset="1" stop-color="#1d4f74"/></linearGradient>
          </defs>
          <!-- axis: Eocene 60–660 px (stretched), Oligocene 660–800, Miocene 800–1020, Plio–Pleistocene 1020–1140 -->
          <rect x="60" y="190" width="1080" height="10" rx="5" fill="url(#tl)"/>
          <g font-size="16" fill="#4f6b7d" text-anchor="middle">
            <text x="60" y="230">53 Ma</text><text x="345" y="230">44 Ma</text><text x="660" y="230">34 Ma</text>
            <text x="800" y="230">23 Ma</text><text x="1020" y="230">5 Ma</text><text x="1140" y="230">today</text>
          </g>
          <g font-size="13" fill="#4f6b7d" text-anchor="middle">
            <text x="360" y="256">EOCENE (stretched)</text><text x="730" y="256">OLIGOCENE</text><text x="910" y="256">MIOCENE</text><text x="1080" y="256">PLIO–PLEIST.</text>
          </g>
          <g stroke="#1d4f74" stroke-width="2">
            <line x1="155" y1="290" x2="155" y2="190"/><line x1="218" y1="330" x2="218" y2="190"/><line x1="186" y1="60" x2="186" y2="190"/>
            <line x1="330" y1="120" x2="330" y2="190"/><line x1="439" y1="290" x2="439" y2="190"/><line x1="597" y1="60" x2="597" y2="190"/>
            <line x1="730" y1="290" x2="730" y2="190"/><line x1="898" y1="120" x2="898" y2="190"/><line x1="1068" y1="290" x2="1068" y2="190"/>
          </g>
          <g font-size="17" fill="#17303f">
            <text x="148" y="310" text-anchor="end" font-weight="700">Pakicetids</text><text x="148" y="330" text-anchor="end" font-size="14" fill="#4f6b7d">~50 Ma · rivers</text>
            <text x="226" y="350" font-weight="700">Raoellids</text><text x="226" y="370" font-size="14" fill="#4f6b7d">Indohyus ~48 Ma · wading sister group</text>
            <text x="186" y="52" text-anchor="middle" font-weight="700">Ambulocetids</text><text x="186" y="32" text-anchor="middle" font-size="14" fill="#4f6b7d">~49 Ma · walking and swimming</text>
            <text x="330" y="112" text-anchor="middle" font-weight="700">Protocetids</text><text x="330" y="92" text-anchor="middle" font-size="14" fill="#4f6b7d">~47–40 Ma · seagoing, birth on land</text>
            <text x="439" y="310" text-anchor="middle" font-weight="700">Basilosaurids</text><text x="439" y="330" text-anchor="middle" font-size="14" fill="#4f6b7d">~41–34 Ma · fully aquatic</text>

          </g>
          </svg>
        <p class="caption" style="text-align:left;margin-top:0">First-appearance ages rounded from the cited papers; the Eocene/Oligocene boundary is 33.9 Ma (ICS 2023). The Eocene takes more than half of the line so that its events can be read.</p>
        <aside class="notes">
          Ages: Uhen (2010) Table 1 and text; Marx, Lambert &amp; Uhen (2016) Cetacean Paleobiology; International Chronostratigraphic Chart v2023/09 (Eocene–Oligocene boundary 33.9 Ma).
          Gigantism timing: Slater, G.J., Goldbogen, J.A. &amp; Pyenson, N.D. (2017) "Independent evolution of baleen whale gigantism linked to Plio-Pleistocene ocean dynamics", Proc. R. Soc. B 284:20170546.
        </aside>
      </section>

      <!-- 4 · Indohyus -->
      <section data-ref="Thewissen et al. 2007 Nature 450:1190">
        <div class="wash" style="left:820px;top:120px;width:460px;height:380px;"></div>
        <div class="kicker">Transition 1 · a wading relative</div>
        <h2><em>Indohyus</em>: the raoellids, sister group of whales.</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li>Raccoon-sized artiodactyl from the <strong>middle Eocene of Kashmir, India</strong> (~48 Ma), described from a skeleton in 2007.</li>
              <li>Shares with whales the <strong>involucrum</strong>: a thickened wall of the auditory bulla otherwise found only in cetaceans.</li>
              <li>Heavy, <strong>osteosclerotic</strong> limb bones (ballast, as in hippos and otters) and oxygen isotopes of teeth indicate time spent in water.</li>
              <li>Teeth suggest a plant-based or omnivorous diet — the first step into water was <strong>not</strong> about hunting fish.</li>
            </ul>
          </div>
          <div class="col">
            <div class="card">
              <p><strong>Why it matters.</strong> <em>Indohyus</em> shows that aquatic habits (wading, hiding in water) preceded the dietary and locomotor changes seen in true whales; the ear came first.</p>
            </div>
          </div>
        </div>
        <aside class="notes">
          Thewissen, J.G.M., Cooper, L.N., Clementz, M.T., Bajpai, S. &amp; Tiwari, B.N. (2007) "Whales originated from aquatic artiodactyls in the Eocene epoch of India", Nature 450:1190–1194.
        </aside>
      </section>

      <!-- 5 · Pakicetus -->
      <section data-ref="Gingerich et al. 1983 Science 220:403; Thewissen et al. 2001 Nature 413:277">
        <div class="kicker">Transition 2 · the earliest whales</div>
        <h2><em>Pakicetus</em> (~50 Ma): a whale that walked on four legs.</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li>Early Eocene of <strong>Pakistan</strong> (Kuldana Formation); first described from a skull in 1983, skeletons in 2001.</li>
              <li>Wolf-sized, long-snouted, with eyes set high on the skull; limbs built for land and shallow water — <strong>not</strong> a swimmer's body.</li>
              <li>Recognised as a cetacean by its <strong>ear</strong> (involucrum, pachyosteosclerotic bulla) and teeth, long before its body was known.</li>
              <li>Ankle bones with the artiodactyl <strong>double-pulley astragalus</strong>: the fossil and molecular stories agree.</li>
            </ul>
          </div>
          <div class="col">
            <svg viewBox="0 0 420 200" width="440" height="210" aria-label="Stylised silhouette of Pakicetus, a four-legged early whale with a long snout and tail">
              <g transform="translate(0,-14)">
                <path d="M150,126 C140,100 150,80 190,74 C230,68 280,70 310,66 C340,62 366,60 392,70 C400,74 396,80 386,82 C370,86 352,88 336,90 C320,92 306,96 298,102 C292,110 286,118 280,126 L288,160 L276,160 L266,128 C246,130 224,130 206,128 L212,160 L200,160 L188,128 C176,128 162,128 150,126 Z" fill="#1d4f74" opacity=".9"/>
                <path d="M150,122 C120,124 80,130 40,150 C30,156 24,166 26,176" stroke="#1d4f74" stroke-width="9" fill="none" stroke-linecap="round"/>
                <circle cx="352" cy="72" r="3.5" fill="#eef4f8"/>
              </g>
            </svg>
            <p class="caption">Shape only; proportions are schematic.</p>
          </div>
        </div>
        <aside class="notes">
          Gingerich, P.D., Wells, N.A., Russell, D.E. &amp; Shah, S.M.I. (1983) "Origin of whales in epicontinental remnant seas: new evidence from the early Eocene of Pakistan", Science 220:403–406.
          Thewissen, J.G.M., Williams, E.M., Roe, L.J. &amp; Hussain, S.T. (2001) "Skeletons of terrestrial cetaceans and the relationship of whales to artiodactyls", Nature 413:277–281.
        </aside>
      </section>

      <!-- 6 · Ambulocetus -->
      <section data-ref="Thewissen, Hussain & Arif 1994 Science 263:210; Nummela et al. 2004 Nature 430:776">
        <div class="wash light" style="left:-80px;top:380px;width:520px;height:360px;"></div>
        <div class="kicker">Transition 3 · the walking, swimming whale</div>
        <h2><em>Ambulocetus natans</em> (~49 Ma): an ambush predator at the water's edge.</h2>
        <ul>
          <li>About <strong>3 m long</strong>, from the early–middle Eocene of Pakistan; large hind feet and a powerful tail suggest swimming by <strong>pelvic paddling and undulation</strong>, like an otter.</li>
          <li>Could still support itself on land; crocodile-like ecology inferred from skull shape and stable isotopes (fresh to brackish water).</li>
          <li>Hearing: early whales had a <strong>mandibular fat pad</strong> pathway for underwater sound, while pakicetids still heard mostly in air (Nummela et al. 2004).</li>
        </ul>
        <div class="card" style="position:absolute;left:720px;top:470px;width:500px;">
          <p><strong>Naming.</strong> <em>Ambulocetus natans</em> = "the walking whale that swims" — the name says exactly what the skeleton shows.</p>
        </div>
        <aside class="notes">
          Thewissen, J.G.M., Hussain, S.T. &amp; Arif, M. (1994) "Fossil evidence for the origin of aquatic locomotion in archaeocete whales", Science 263:210–212.
          Nummela, S., Thewissen, J.G.M., Bajpai, S., Hussain, S.T. &amp; Kumar, K. (2004) "Eocene evolution of whale hearing", Nature 430:776–778.
        </aside>
      </section>

      <!-- 7 · Protocetids -->
      <section data-ref="Gingerich et al. 1994 Nature 368:844; Gingerich et al. 2009 PLoS ONE 4:e4366; Lambert et al. 2019 Curr Biol 29:1352">
        <div class="kicker">Transition 4 · going to sea</div>
        <h2>Protocetids: seagoing whales that still gave birth on land.</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li><em>Rodhocetus</em> (~47 Ma, Pakistan): shortened neck, robust tail, hind limbs still weight-bearing (Gingerich et al. 1994).</li>
              <li><em>Maiacetus inuus</em> (~47.5 Ma): a female preserved with a near-term <strong>fetus positioned head-first</strong> — modern whales are born tail-first — implying birth on land (Gingerich et al. 2009).</li>
              <li><em>Peregocetus pacificus</em> (~42.6 Ma, Peru): a four-legged whale on the Pacific coast of South America, showing protocetids had <strong>crossed the Atlantic</strong> by the middle Eocene (Lambert et al. 2019).</li>
            </ul>
          </div>
          <div class="col">
            <table>
              <tr><th>Genus</th><th>Age</th><th>Where</th></tr>
              <tr><td><em>Rodhocetus</em></td><td>~47 Ma</td><td>Pakistan</td></tr>
              <tr><td><em>Maiacetus</em></td><td>~47.5 Ma</td><td>Pakistan</td></tr>
              <tr><td><em>Georgiacetus</em></td><td>~40 Ma</td><td>SE United States</td></tr>
              <tr><td><em>Peregocetus</em></td><td>~42.6 Ma</td><td>Peru</td></tr>
            </table>
            <p class="caption">Ages as reported in the describing papers.</p>
          </div>
        </div>
        <aside class="notes">
          Gingerich, P.D., Raza, S.M., Arif, M., Anwar, M. &amp; Zhou, X. (1994) "New whale from the Eocene of Pakistan and the origin of cetacean swimming", Nature 368:844–847.
          Gingerich, P.D., ul-Haq, M., von Koenigswald, W., Sanders, W.J., Smith, B.H. &amp; Zalmout, I.S. (2009) "New protocetid whale from the middle Eocene of Pakistan: birth on land, precocial development, and sexual dimorphism", PLoS ONE 4(2):e4366.
          Lambert, O., Bianucci, G., Salas-Gismondi, R., Di Celma, C., Steurbaut, E., Urbina, M. &amp; de Muizon, C. (2019) "An amphibious whale from the middle Eocene of Peru reveals early South Pacific dispersal of quadrupedal cetaceans", Current Biology 29:1352–1359.
          Georgiacetus: Hulbert, R.C. et al. (1998) Journal of Paleontology 72:907–927.
        </aside>
      </section>

      <!-- 8 · Basilosaurids -->
      <section data-ref="Gingerich, Smith & Simons 1990 Science 249:154; Uhen 2004 Univ. Michigan Papers on Paleontology 34">
        <div class="wash deep" style="left:640px;top:-60px;width:720px;height:420px;"></div>
        <div class="kicker">Transition 5 · fully aquatic</div>
        <h2>Basilosaurids (~41–34 Ma): whales that could no longer leave the water.</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li><em>Basilosaurus</em> (up to ~17–18 m, eel-like body) and <em>Dorudon</em> (~5 m): fully marine, with tail flukes and flipper-like forelimbs.</li>
              <li>Tiny but complete <strong>hind limbs</strong> preserved in <em>Basilosaurus isis</em> — with knee, ankle and toes — too small to bear weight (Gingerich et al. 1990).</li>
              <li>Nostrils have moved back along the snout; the pelvis is no longer attached to the spine.</li>
              <li>Best known from <strong>Wadi Al-Hitan</strong> ("Valley of Whales"), Egypt — a UNESCO World Heritage site since 2005.</li>
            </ul>
          </div>
          <div class="col">
            <svg viewBox="0 0 460 160" width="460" height="160" aria-label="Stylised Basilosaurus silhouette: a long, slender body with tiny hind limbs">
              <path d="M10,84 C24,66 60,58 110,60 C200,62 300,70 380,76 C396,77 404,78 410,80 C404,83 396,84 380,86 C300,96 200,104 110,102 C60,102 24,98 10,84 Z" fill="#1d4f74"/>
              <path d="M406,80 C420,68 444,62 446,68 C436,74 428,78 422,80 C428,82 436,88 446,94 C444,100 420,92 406,80 Z" fill="#1d4f74"/>
              <path d="M70,98 C80,112 100,114 112,106 C98,104 84,102 70,98 Z" fill="#1d4f74"/>
              <path d="M330,92 l4,12 l8,-10 z" fill="#1d4f74"/>
              <circle cx="40" cy="76" r="3" fill="#eef4f8"/>
            </svg>
            <p class="caption">The hind limb (small triangle near the tail) is a few percent of body length.</p>
          </div>
        </div>
        <aside class="notes">
          Gingerich, P.D., Smith, B.H. &amp; Simons, E.L. (1990) "Hind limbs of Eocene Basilosaurus: evidence of feet in whales", Science 249:154–157.
          Uhen, M.D. (2004) "Form, function, and anatomy of Dorudon atrox (Mammalia, Cetacea): an archaeocete from the middle to late Eocene of Egypt", University of Michigan Papers on Paleontology 34:1–222.
          UNESCO World Heritage List: Wadi Al-Hitan (Whale Valley), inscribed 2005.
        </aside>
      </section>

      <!-- 9 · body plan -->
      <section data-ref="Thewissen et al. 2006 PNAS 103:8414; Thewissen et al. 2009">
        <div class="kicker">What actually changed</div>
        <h2>The anatomical checklist of becoming a whale.</h2>
        <table>
          <tr><th>Trait</th><th>Land ancestor</th><th>Modern whale</th><th>Evidence</th></tr>
          <tr><td>Nostrils</td><td>tip of snout</td><td>blowhole on top of head</td><td>progressive migration through protocetids and basilosaurids</td></tr>
          <tr><td>Hearing</td><td>air-borne, via eardrum</td><td>water-borne, via jaw fat pad and isolated bulla</td><td>involucrum already in raoellids; fat pad in ambulocetids</td></tr>
          <tr><td>Forelimb</td><td>walking leg</td><td>flipper, fingers encased</td><td>protocetids keep flexible elbows; basilosaurids lose them</td></tr>
          <tr><td>Hind limb</td><td>weight-bearing</td><td>vestigial pelvis, no external limb</td><td><em>Sonic hedgehog</em> signalling shuts down in the dolphin hind-limb bud (Thewissen et al. 2006)</td></tr>
          <tr><td>Tail</td><td>balance</td><td>horizontal fluke, main propulsor</td><td>flattened tail vertebrae in basilosaurids</td></tr>
          <tr><td>Pelvis</td><td>fused to sacrum</td><td>free-floating</td><td>sacrum lost by the basilosaurid stage</td></tr>
        </table>
        <aside class="notes">
          Thewissen, J.G.M., Cohn, M.J., Stevens, L.S., Bajpai, S., Heyning, J. &amp; Horton, W.E. Jr (2006) "Developmental basis for hind-limb loss in dolphins and origin of the cetacean bodyplan", PNAS 103:8414–8418.
          Thewissen et al. (2009) Evolution: Education and Outreach 2:272–288 (review of the anatomical sequence).
        </aside>
      </section>

      <!-- 10 · Neoceti / mysticetes -->
      <section data-ref="Lambert et al. 2017 Curr Biol 27:1535; Geisler et al. 2017 Curr Biol 27:2036; Fordyce & Marx 2018 Curr Biol 28:1670">
        <div class="wash light" style="left:840px;top:380px;width:480px;height:360px;"></div>
        <div class="kicker">Transition 6 · the great split</div>
        <h2>Baleen whales began with teeth.</h2>
        <ul>
          <li>Around <strong>36–34 Ma</strong> the crown group <span class="accent">Neoceti</span> splits into Mysticeti (baleen whales) and Odontoceti (toothed whales).</li>
          <li><em>Mystacodon selenensis</em> (36.4 Ma, Peru) is the oldest known mysticete — and it has <strong>teeth</strong>, with wear suggesting suction feeding (Lambert et al. 2017).</li>
          <li><em>Coronodon havensteini</em> (Oligocene, South Carolina) apparently <strong>filtered with its teeth</strong>, using slots between them (Geisler et al. 2017).</li>
          <li>Aetiocetids had teeth plus, in some interpretations, incipient baleen; <em>Llanocetus</em> (~34 Ma, Antarctica) was already toothed and large (Fordyce &amp; Marx 2018).</li>
          <li>Baleen itself rarely fossilises; its presence is inferred from <strong>nutrient foramina</strong> on the palate.</li>
        </ul>
        <aside class="notes">
          Lambert, O., Martínez-Cáceres, M., Bianucci, G., Di Celma, C., Salas-Gismondi, R., Steurbaut, E., Urbina, M. &amp; de Muizon, C. (2017) "Earliest mysticete from the late Eocene of Peru sheds new light on the origin of baleen whales", Current Biology 27:1535–1541.
          Geisler, J.H., Boessenecker, R.W., Brown, M. &amp; Beatty, B.L. (2017) "The origin of filter feeding in whales", Current Biology 27:2036–2042.
          Fordyce, R.E. &amp; Marx, F.G. (2018) "Gigantism precedes filter feeding in baleen whale evolution", Current Biology 28:1670–1676.
        </aside>
      </section>

      <!-- 11 · echolocation -->
      <section data-ref="Geisler et al. 2014 Nature 508:383; Churchill et al. 2016 Curr Biol 26:2144">
        <div class="kicker">Transition 7 · seeing with sound</div>
        <h2>Toothed whales evolved echolocation early.</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li><em>Cotylocara macei</em> (~28 Ma, South Carolina) shows a skull with <strong>asymmetry and deep air sinuses</strong> — the bony correlates of a sound-producing nasal apparatus (Geisler et al. 2014).</li>
              <li><em>Echovenator sandersi</em> (Oligocene) had a cochlea adapted to <strong>ultrasonic hearing</strong>, indicating high-frequency hearing arose at or near the base of Odontoceti (Churchill et al. 2016).</li>
              <li>Modern toothed whales produce clicks with <strong>phonic lips</strong> in the nasal passages, focus them through the melon, and receive echoes through the fat-filled lower jaw.</li>
            </ul>
          </div>
          <div class="col">
            <div class="card">
              <p><strong>Two strategies, one ancestor.</strong> Within a few million years of the Neoceti split, one lineage was screening prey out of water, the other was ranging it with sound. Both are solutions to feeding in an ocean where the eyes are of limited use.</p>
            </div>
          </div>
        </div>
        <aside class="notes">
          Geisler, J.H., Colbert, M.W. &amp; Carew, J.L. (2014) "A new fossil species supports an early origin for toothed whale echolocation", Nature 508:383–386.
          Churchill, M., Martínez-Cáceres, M., de Muizon, C., Mnieckowski, J. &amp; Geisler, J.H. (2016) "The origin of high-frequency hearing in whales", Current Biology 26:2144–2149.
        </aside>
      </section>

      <!-- 12 · gigantism -->
      <section data-ref="Slater, Goldbogen & Pyenson 2017 Proc R Soc B 284:20170546; Goldbogen et al. 2019 Science 366:1367">
        <div class="wash deep" style="left:-160px;top:80px;width:640px;height:520px;"></div>
        <div class="kicker">Transition 8 · becoming enormous</div>
        <h2>Whales were not always giants. Gigantism is geologically recent.</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li>Body-size analysis of living and fossil baleen whales shows very large size (&gt; 10 m) evolving <strong>independently in several lineages within the last ~4.5 million years</strong> (Slater et al. 2017).</li>
              <li>The proposed driver: Plio-Pleistocene cooling and wind-driven <strong>coastal upwelling</strong> concentrated prey into dense seasonal patches, rewarding lunge-feeders that travel far and eat in bulk.</li>
              <li>The blue whale, up to ~30 m and well over 100 tonnes, is the largest animal known to have lived; energetic measurements suggest filter-feeding sizes are capped by the cost of a lunge (Goldbogen et al. 2019).</li>
            </ul>
          </div>
          <div class="col">
            <svg viewBox="0 0 440 240" width="440" height="240" aria-label="Relative lengths: Pakicetus about 1.8 metres, Dorudon 5 metres, Basilosaurus 17 metres, blue whale 30 metres" style="font-family:inherit">
              <g fill="#1d4f74">
                <rect x="20" y="30" width="24" height="16" rx="8"/><rect x="20" y="70" width="67" height="16" rx="8"/><rect x="20" y="110" width="228" height="16" rx="8"/><rect x="20" y="150" width="402" height="16" rx="8"/>
              </g>
              <g font-size="14" fill="#17303f">
                <text x="20" y="24"><tspan font-style="italic">Pakicetus</tspan> ~1.8 m</text>
                <text x="20" y="64"><tspan font-style="italic">Dorudon</tspan> ~5 m</text>
                <text x="20" y="104"><tspan font-style="italic">Basilosaurus</tspan> ~17 m</text>
                <text x="20" y="144">Blue whale ~30 m</text>
              </g>
              <text x="20" y="200" font-size="13" fill="#4f6b7d">Bar length ∝ body length (approximate adult sizes).</text>
            </svg>
          </div>
        </div>
        <aside class="notes">
          Slater, G.J., Goldbogen, J.A. &amp; Pyenson, N.D. (2017) "Independent evolution of baleen whale gigantism linked to Plio-Pleistocene ocean dynamics", Proceedings of the Royal Society B 284:20170546.
          Goldbogen, J.A. et al. (2019) "Why whales are big but not bigger: physiological drivers and ecological limits in the age of ocean giants", Science 366:1367–1372.
          Body lengths: Uhen (2004) for Dorudon; Gingerich (1990s) for Basilosaurus (~16–18 m); Thewissen et al. (2001) for Pakicetus (wolf-sized).
        </aside>
      </section>

      <!-- 13 · genomes -->
      <section data-ref="Huelsmann et al. 2019 Sci Adv 5:eaaw6671; McGowen et al. 2020 Syst Biol 69:479">
        <div class="kicker">Transition 9 · written in the genome</div>
        <h2>The land-to-water transition left a trail of lost genes.</h2>
        <ul>
          <li>Comparing 62 mammalian genomes, Huelsmann et al. (2019) identified <strong>85 protein-coding genes lost</strong> in the cetacean stem lineage.</li>
          <li>Examples with plausible aquatic explanations: <em>AANAT</em> and <em>ASMT</em> (melatonin synthesis — consistent with unihemispheric sleep), <em>F12</em> (a coagulation factor; a possible protection against clotting during dives), <em>KLK8</em> (skin and hair function), <em>SLC4A9</em> (saliva secretion).</li>
          <li>A genome-scale phylogeny of living cetaceans (McGowen et al. 2020) dates the crown Neoceti divergence and resolves the placement of most families.</li>
        </ul>
        <div class="card" style="margin-top:14px;">
          <p><strong>Caveat.</strong> Gene loss correlates with the transition; the functional stories are hypotheses tested one gene at a time, and not all losses have known consequences.</p>
        </div>
        <aside class="notes">
          Huelsmann, M., Hecker, N., Springer, M.S., Gatesy, J., Sharma, V. &amp; Hiller, M. (2019) "Genes lost during the transition from land to water in cetaceans highlight genomic changes associated with aquatic adaptations", Science Advances 5:eaaw6671.
          McGowen, M.R. et al. (2020) "Phylogenomic resolution of the cetacean tree of life using target sequence capture", Systematic Biology 69:479–501.
        </aside>
      </section>

      <!-- 14 · closing -->
      <section class="break" data-ref="synthesis">
        <div class="wash" style="left:700px;top:120px;width:560px;height:460px;"></div>
        <div class="wash warm" style="left:-100px;top:500px;width:420px;height:240px;"></div>
        <p class="big">Ear first, then feet, then sound and size.</p>
        <p class="sub">Whale evolution is one of the best-documented macroevolutionary transitions: molecules, fossils and development all tell the same story, and the fossil record keeps filling the gaps — from Kashmir to Peru.</p>
        <aside class="notes">
          Closing synthesis; see the references slide. A good general-audience account: Pyenson, N.D. (2018) Spying on Whales, Viking; and Thewissen, J.G.M. (2014) The Walking Whales, University of California Press.
        </aside>
      </section>

`,xt=`/* Aquarelle — blue watercolour on paper. Washes are plain HTML elements with the .wash class. */
:root {
  --paper: #eef4f8; --paper-2: #e2ecf3; --ink: #17303f; --ink-soft: #4f6b7d; --rule: #c9d9e4;
  --accent: #2f6f9f; --accent-2: #c3703a; --wash: #3b7fb0; --wash-2: #8ec1e0; --wash-deep: #1d4f74;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.reveal-viewport {
  background: var(--paper);
  background-image:
    radial-gradient(60% 40% at 8% 100%, rgba(59,127,176,.22), transparent 70%),
    radial-gradient(45% 35% at 96% 0%, rgba(142,193,224,.35), transparent 70%),
    radial-gradient(30% 25% at 70% 90%, rgba(29,79,116,.12), transparent 70%);
}
.reveal { font-family: var(--sans); font-size: 30px; color: var(--ink); }
.reveal h1, .reveal h2, .reveal h3 { font-family: var(--serif); font-weight: 600; color: var(--wash-deep); }
.reveal .kicker { color: var(--accent-2); }
.reveal .accent { color: var(--accent); font-weight: 600; }
.reveal .accent-2 { color: var(--accent-2); font-weight: 600; }
.reveal .soft { color: var(--ink-soft); opacity: 1; }
.reveal .caption, .reveal .cite { color: var(--ink-soft); }
.reveal .card { background: rgba(255,255,255,.55); border: 1px solid rgba(201,217,228,.8); backdrop-filter: blur(2px); }
.reveal img.fig { background: #fff; padding: 8px; box-shadow: 0 10px 30px rgba(23,48,63,.15); }
.reveal table th { color: var(--ink-soft); border-bottom: 2px solid var(--accent); }
.reveal table td { border-bottom: 1px solid var(--rule); }
/* washes must not bleed outside the slide */
.reveal .slides > section { height: 100%; overflow: hidden; }
/* watercolour wash: a soft irregular blob, e.g. behind a title or as a decorative shape */
.reveal .wash { position: absolute; border-radius: 45% 55% 50% 50% / 55% 45% 55% 45%; background: var(--wash); opacity: .28; filter: url(#wc-edge); pointer-events: none; }
.reveal .wash.light { background: var(--wash-2); opacity: .45; }
.reveal .wash.deep { background: var(--wash-deep); opacity: .22; }
.reveal .wash.warm { background: var(--accent-2); opacity: .22; }
.reveal section.title-slide .sub { font-family: var(--serif); font-style: italic; color: var(--ink-soft); }
.reveal section.title-slide .meta { color: var(--ink-soft); }
.reveal section.break .big { font-family: var(--serif); color: var(--wash-deep); }
.reveal section.break .sub { color: var(--ink-soft); }

/* ---- shared vocabulary ---- */
.reveal .slides { text-align: left; }
.reveal .slides section { padding: 24px 40px; box-sizing: border-box; }

.reveal table td, .reveal table th { font-size: 0.92em; }`,kt=`<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Préparer l'entretien de naturalisation</title>
  <meta name="description" content="Guide de préparation à l'entretien d'assimilation de la procédure de naturalisation par décret : cadre juridique, déroulement, connaissances attendues, conseils.">
  <meta name="references" content="Code civil art. 21-15 à 21-28 ; décret n° 93-1362 du 30 décembre 1993 ; loi n° 2024-42 du 26 janvier 2024 ; Livret du citoyen (ministère de l'Intérieur) ; service-public.fr ; vie-publique.fr ; INSEE. Détail sur la dernière diapositive et dans les notes de chaque diapositive.">
  <meta name="updated" content="2026-08">
  <link rel="stylesheet" href="../../reveal/dist/reset.css">
  <link rel="stylesheet" href="../../reveal/dist/reveal.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="reveal">
    <div class="slides">

      <!-- 1 · titre -->
      <section class="title-slide" data-ref="Code civil art. 21-24 ; décret 93-1362 art. 41">
        <h1><span class="tricolore"></span>Préparer l'entretien de naturalisation.</h1>
        <p class="sub">L'« entretien d'assimilation » de la naturalisation par décret</p>
        <p class="meta"><b>Cadre juridique · déroulement · connaissances attendues · conseils</b><br><span class="soft">Sources sur chaque diapositive (attribut <code>data-ref</code> et notes de l'orateur, touche S). État du droit : août 2026 — vérifiez les textes en vigueur.</span></p>
        <aside class="notes">
          Sources générales : Code civil, articles 21-15 à 21-28 (Légifrance) ; décret n° 93-1362 du 30 décembre 1993 relatif aux déclarations de nationalité, aux décisions de naturalisation, de réintégration, de perte, de déchéance et de retrait de la nationalité française, notamment l'article 41 (entretien) ; « Livret du citoyen », ministère de l'Intérieur ; fiche service-public.fr « Naturalisation » (F2213).
          Les conditions de naturalisation évoluent (loi n° 2024-42 du 26 janvier 2024 et ses décrets d'application) : toujours confronter ces diapositives aux textes du jour.
        </aside>
      </section>

      <!-- 2 · qu'est-ce que l'entretien -->
      <section data-ref="Code civil art. 21-24 ; décret 93-1362 art. 41 ; décret 2012-127 (Charte)">
        <div class="kicker">Le cadre</div>
        <h2>Qu'est-ce que l'entretien ?</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li>Un entretien individuel avec un agent de la <strong>préfecture</strong> (plateforme de naturalisation), prévu par l'article 41 du décret du 30 décembre 1993.</li>
              <li>Son objet : vérifier l'<strong>assimilation à la communauté française</strong> exigée par l'article 21-24 du Code civil.</li>
              <li>Il porte sur : votre <strong>parcours</strong>, votre connaissance de la <strong>langue</strong>, de l'<strong>histoire</strong>, de la <strong>culture</strong> et de la <strong>société</strong> françaises, des <strong>droits et devoirs</strong> du citoyen, et votre <strong>adhésion aux principes et valeurs</strong> de la République.</li>
              <li>À l'issue, vous signez la <strong>Charte des droits et devoirs du citoyen français</strong> (décret n° 2012-127 du 30 janvier 2012).</li>
            </ul>
          </div>
          <div class="col">
            <div class="card">
              <h3>Ce qu'il n'est pas</h3>
              <p>Ce n'est ni un examen scolaire ni un interrogatoire : l'agent rédige un compte rendu d'entretien qui est transmis, avec le dossier, au ministère chargé des naturalisations, qui prend la décision.</p>
            </div>
            <div class="warn" style="margin-top:14px;">Depuis la loi du 26 janvier 2024, l'appréciation de l'assimilation s'appuie aussi sur un <strong>examen civique</strong> et sur un niveau de langue relevé (voir diapositive suivante). Les modalités exactes sont fixées par décret : consultez service-public.fr.</div>
          </div>
        </div>
        <aside class="notes">
          Code civil, art. 21-24 : « Nul ne peut être naturalisé s'il ne justifie de son assimilation à la communauté française, notamment par une connaissance suffisante, selon sa condition, de la langue, de l'histoire, de la culture et de la société françaises, dont le niveau et les modalités d'évaluation sont fixés par décret en Conseil d'État, et des droits et devoirs conférés par la nationalité française ainsi que par l'adhésion aux principes et aux valeurs essentiels de la République. À l'issue du contrôle de son assimilation, l'intéressé signe la charte des droits et devoirs du citoyen français. »
          Décret n° 93-1362, art. 41 : l'agent chargé de recevoir la demande vérifie l'assimilation au cours d'un entretien individuel et en dresse un compte rendu.
          Charte : décret n° 2012-127 du 30 janvier 2012 approuvant la charte des droits et devoirs du citoyen français.
          Loi n° 2024-42 du 26 janvier 2024 pour contrôler l'immigration, améliorer l'intégration (JORF du 27 janvier 2024).
        </aside>
      </section>

      <!-- 3 · conditions -->
      <section data-ref="Code civil art. 21-16 à 21-27 ; loi 2024-42 ; décret 2019-1507 ; service-public.fr F2213">
        <div class="kicker">Rappel</div>
        <h2>Les conditions de la naturalisation par décret.</h2>
        <table>
          <tr><th>Condition</th><th>Règle</th><th>Texte</th></tr>
          <tr><td>Âge</td><td>Être majeur (18 ans)</td><td>C. civ. art. 21-22</td></tr>
          <tr><td>Résidence</td><td>Résider en France au moment de la signature du décret et y avoir sa résidence habituelle depuis <strong>5 ans</strong> (2 ans après deux années d'études supérieures réussies en France ; dispenses dans certains cas)</td><td>C. civ. art. 21-16 à 21-20</td></tr>
          <tr><td>Langue</td><td>Niveau <strong>B2</strong> (oral et écrit) du cadre européen depuis le 1<sup>er</sup> janvier 2026 ; B1 auparavant (depuis le 1<sup>er</sup> avril 2020)</td><td>Loi 2024-42 ; décret 2019-1507</td></tr>
          <tr><td>Connaissances</td><td>Histoire, culture, société, droits et devoirs — vérifiées à l'entretien et, depuis 2026, par un examen civique</td><td>C. civ. art. 21-24</td></tr>
          <tr><td>Moralité</td><td>Bonnes vie et mœurs ; absence de condamnations incompatibles (casier judiciaire)</td><td>C. civ. art. 21-23, 21-27</td></tr>
          <tr><td>Insertion</td><td>Ressources stables et suffisantes, insertion professionnelle appréciées par l'administration</td><td>Pratique administrative (circulaires)</td></tr>
          <tr><td>Formalités</td><td>Dépôt en ligne (ANEF), timbre fiscal de <strong>55 €</strong></td><td>service-public.fr</td></tr>
        </table>
        <aside class="notes">
          Résidence : art. 21-17 (5 ans), 21-18 (réduction à 2 ans : études supérieures, services importants), 21-19 et 21-20 (dispenses de stage, notamment pour les ressortissants d'États dont la langue officielle ou l'une des langues officielles est le français, sous conditions).
          Langue : décret n° 2019-1507 du 30 décembre 2019 (niveau B1 oral et écrit à compter du 1er avril 2020) ; la loi n° 2024-42 relève le niveau à B2 pour la naturalisation, avec entrée en vigueur au 1er janvier 2026 fixée par décret d'application. Les diplômes et tests acceptés (TCF, TEF, DELF/DALF…) sont listés sur service-public.fr.
          Le montant du droit de timbre (55 €) et la procédure dématérialisée sont ceux indiqués par service-public.fr (fiche F2213) à la date de mise à jour de ce diaporama ; vérifier.
        </aside>
      </section>

      <!-- 4 · déroulement -->
      <section data-ref="Code civil art. 21-25-1 ; décret 93-1362 art. 44 et s. ; service-public.fr F2213">
        <div class="kicker">La procédure</div>
        <h2>Comment cela se passe, avant et après l'entretien.</h2>
        <div class="cols">
          <div class="col">
            <h3>Avant</h3>
            <ul>
              <li>Dépôt du dossier complet ; récépissé de dépôt.</li>
              <li>Convocation à l'entretien par la préfecture (parfois plusieurs mois après).</li>
              <li>Apportez les <strong>originaux</strong> des pièces du dossier et une pièce d'identité.</li>
            </ul>
            <h3>Pendant</h3>
            <ul>
              <li>De 20 minutes à une heure, seul avec l'agent.</li>
              <li>Questions sur votre parcours, puis sur la France ; signature de la Charte.</li>
            </ul>
          </div>
          <div class="col">
            <h3>Après</h3>
            <ul>
              <li>Délai maximal de réponse : <strong>18 mois</strong> à compter du récépissé (<strong>12 mois</strong> si vous résidez en France depuis au moins 10 ans) — C. civ. art. 21-25-1.</li>
              <li>Issues possibles : <strong>décret de naturalisation</strong> publié au Journal officiel ; <strong>ajournement</strong> (motivé, avec un délai) ; <strong>rejet</strong> ; irrecevabilité.</li>
              <li>Recours : recours administratif préalable obligatoire auprès du ministre dans les <strong>2 mois</strong>, puis tribunal administratif de <strong>Nantes</strong>.</li>
            </ul>
          </div>
        </div>
        <p class="cite">Les délais de traitement effectifs varient fortement selon les préfectures.</p>
        <aside class="notes">
          Code civil, art. 21-25-1 : « La réponse de l'autorité publique à une demande d'acquisition de la nationalité française par naturalisation doit intervenir au plus tard dix-huit mois à compter de la date de délivrance du récépissé constatant la remise de toutes les pièces nécessaires… Le délai est réduit à douze mois lorsque l'étranger… justifie avoir en France sa résidence habituelle depuis une période d'au moins dix ans. »
          Décret n° 93-1362, art. 44 à 49 (décision, ajournement, rejet, recours). Le recours administratif préalable obligatoire (RAPO) devant le ministre chargé des naturalisations est exercé dans les deux mois ; le tribunal administratif de Nantes est compétent (art. 45 et s. du décret ; R. 312-18 CJA).
        </aside>
      </section>

      <!-- 5 · parcours personnel -->
      <section data-ref="Livret du citoyen ; pratique des plateformes de naturalisation">
        <div class="kicker">Première partie de l'entretien</div>
        <h2>Votre parcours : les questions que l'on vous posera presque sûrement.</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li><span class="q">Quand et pourquoi êtes-vous venu·e en France ?</span></li>
              <li><span class="q">Que faites-vous aujourd'hui ? Où avez-vous travaillé, étudié ?</span></li>
              <li><span class="q">Où vivez-vous, avec qui ? Votre famille est-elle en France ?</span></li>
              <li><span class="q">Pourquoi demandez-vous la nationalité française ?</span></li>
              <li><span class="q">Quels liens avez-vous avec votre pays d'origine ?</span></li>
              <li><span class="q">Êtes-vous engagé·e dans une association, une activité locale ?</span></li>
            </ul>
          </div>
          <div class="col">
            <div class="card">
              <h3>Conseils</h3>
              <p>Racontez un parcours <strong>cohérent avec votre dossier</strong> (dates, employeurs, adresses). Préparez une réponse sincère et concrète sur vos motivations : la France comme lieu de vie, de travail, de famille, d'avenir — plutôt qu'un avantage pratique. Parlez de vos impôts, de votre logement, de votre insertion : ce sont des critères d'appréciation.</p>
            </div>
          </div>
        </div>
        <aside class="notes">
          Le contenu des questions personnelles n'est pas fixé par un texte ; il découle de l'objet de l'entretien (art. 21-24 C. civ. : assimilation « selon sa condition ») et de la pratique des plateformes de naturalisation. Le « Livret du citoyen » du ministère de l'Intérieur indique les thèmes de connaissances attendus.
        </aside>
      </section>

      <!-- 6 · symboles -->
      <section data-ref="Constitution du 4 octobre 1958, art. 2 ; loi du 6 juillet 1880 ; Livret du citoyen">
        <div class="kicker">Connaissances · les symboles</div>
        <h2>Les symboles de la République.</h2>
        <table>
          <tr><th>Symbole</th><th>Ce qu'il faut savoir</th></tr>
          <tr><td><strong>Le drapeau</strong> bleu, blanc, rouge</td><td>Emblème national (Constitution, art. 2). Les couleurs de Paris (bleu et rouge) associées au blanc royal en 1789 ; forme actuelle fixée en 1794.</td></tr>
          <tr><td><strong>La Marseillaise</strong></td><td>Hymne national (art. 2). Composée à Strasbourg en 1792 par Rouget de Lisle ; hymne national en 1795, puis définitivement en 1879.</td></tr>
          <tr><td><strong>La devise</strong></td><td>« Liberté, Égalité, Fraternité » (art. 2) ; héritée de la Révolution, inscrite dans les constitutions de 1946 et 1958.</td></tr>
          <tr><td><strong>Le 14 juillet</strong></td><td>Fête nationale depuis la loi du 6 juillet 1880 ; commémore la prise de la Bastille (1789) et la fête de la Fédération (1790).</td></tr>
          <tr><td><strong>Marianne</strong></td><td>Figure allégorique de la République, coiffée du bonnet phrygien ; présente dans les mairies, sur les timbres et les pièces.</td></tr>
          <tr><td><strong>La langue</strong></td><td>« La langue de la République est le français » (art. 2, depuis 1992).</td></tr>
          <tr><td><strong>Le sceau, le coq</strong></td><td>Le sceau de l'État est utilisé pour les textes solennels ; le coq gaulois est un symbole populaire mais non officiel.</td></tr>
        </table>
        <aside class="notes">
          Constitution du 4 octobre 1958, article 2 : langue (loi constitutionnelle du 25 juin 1992), emblème, hymne, devise, principe « gouvernement du peuple, par le peuple et pour le peuple ».
          Loi du 6 juillet 1880 établissant le 14 juillet comme fête nationale annuelle.
          Marseillaise : décret du 14 juillet 1795 (26 messidor an III) la déclarant chant national ; loi du 14 février 1879 la rétablissant comme hymne national.
          Drapeau : décret de la Convention du 15 février 1794 (27 pluviôse an II) fixant le pavillon national.
          Présentation officielle des symboles : elysee.fr (« Les symboles de la République ») et vie-publique.fr.
        </aside>
      </section>

      <!-- 7 · valeurs -->
      <section data-ref="Constitution art. 1er ; loi du 9 décembre 1905 ; Charte des droits et devoirs (décret 2012-127)">
        <div class="kicker">Connaissances · les valeurs</div>
        <h2>Les principes et valeurs essentiels de la République.</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li><strong>Liberté</strong> : de conscience, d'expression, de religion, d'association, de circulation — dans les limites de la loi.</li>
              <li><strong>Égalité</strong> : devant la loi, sans distinction d'origine, de race ou de religion (Constitution, art. 1<sup>er</sup>) ; <strong>égalité entre les femmes et les hommes</strong>.</li>
              <li><strong>Fraternité</strong> : solidarité nationale (Sécurité sociale, services publics, impôt).</li>
              <li><strong>Laïcité</strong> : loi du 9 décembre 1905 — la République garantit le libre exercice des cultes et ne reconnaît ni ne subventionne aucun culte ; l'État est neutre, chacun croit ou ne croit pas.</li>
            </ul>
          </div>
          <div class="col">
            <div class="card">
              <h3>La Charte que vous signerez</h3>
              <p>Elle rappelle les principes de la République (indivisible, laïque, démocratique et sociale), les droits (libertés, égalité, protection sociale) et les devoirs (respecter les lois, contribuer aux charges publiques, participer à la défense, la scolarité des enfants). Sachez expliquer ces mots avec vos propres exemples.</p>
            </div>
          </div>
        </div>
        <aside class="notes">
          Constitution, art. 1er : « La France est une République indivisible, laïque, démocratique et sociale. Elle assure l'égalité devant la loi de tous les citoyens sans distinction d'origine, de race ou de religion. Elle respecte toutes les croyances… La loi favorise l'égal accès des femmes et des hommes aux mandats électoraux et fonctions électives… »
          Loi du 9 décembre 1905 concernant la séparation des Églises et de l'État, art. 1er et 2.
          Charte des droits et devoirs du citoyen français, annexée au décret n° 2012-127 du 30 janvier 2012.
        </aside>
      </section>

      <!-- 8 · institutions -->
      <section data-ref="Constitution de 1958 (art. 6, 8, 24, 56) ; vie-publique.fr">
        <div class="kicker">Connaissances · les institutions</div>
        <h2>Qui fait quoi dans la V<sup>e</sup> République ?</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li><strong>Le Président de la République</strong> : élu pour <strong>5 ans</strong> au suffrage universel direct (depuis le référendum de 1962 ; quinquennat depuis 2000 ; deux mandats consécutifs au plus depuis 2008). Chef de l'État, chef des armées, nomme le Premier ministre.</li>
              <li><strong>Le Gouvernement</strong> : Premier ministre et ministres ; détermine et conduit la politique de la Nation ; responsable devant l'Assemblée nationale.</li>
              <li><strong>Le Parlement</strong> vote la loi : <strong>Assemblée nationale</strong> (577 députés, 5 ans, suffrage direct) et <strong>Sénat</strong> (348 sénateurs, 6 ans, suffrage indirect, renouvelé par moitié tous les 3 ans).</li>
            </ul>
          </div>
          <div class="col">
            <ul>
              <li><strong>Le Conseil constitutionnel</strong> : 9 membres nommés pour 9 ans ; contrôle la conformité des lois à la Constitution.</li>
              <li><strong>La justice</strong> : indépendante ; ordre judiciaire (Cour de cassation au sommet) et ordre administratif (Conseil d'État).</li>
              <li><strong>Le Conseil économique, social et environnemental</strong>, le Défenseur des droits : institutions de conseil et de protection.</li>
              <li>Séparation des pouvoirs : exécutif, législatif, judiciaire.</li>
            </ul>
          </div>
        </div>
        <aside class="notes">
          Constitution : art. 6 (mandat de cinq ans, deux mandats consécutifs — loi constitutionnelle du 23 juillet 2008), art. 7 (élection au suffrage universel direct, issu de la loi constitutionnelle du 6 novembre 1962), art. 8 (nomination du Premier ministre), art. 20 (Gouvernement), art. 24 (Parlement : 577 députés au plus, 348 sénateurs au plus — plafonds inscrits en 2008, effectifs actuels 577 et 348), art. 56 (Conseil constitutionnel), art. 64 (autorité judiciaire).
          Quinquennat : loi constitutionnelle du 2 octobre 2000 après le référendum du 24 septembre 2000.
        </aside>
      </section>

      <!-- 9 · territoire -->
      <section data-ref="INSEE ; loi du 16 janvier 2015 ; vie-publique.fr">
        <div class="kicker">Connaissances · le territoire</div>
        <h2>L'organisation territoriale et quelques repères.</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li>Environ <strong>35 000 communes</strong>, dirigées par un maire élu par le conseil municipal ; élections municipales tous les 6 ans.</li>
              <li><strong>101 départements</strong> (96 en métropole, 5 outre-mer : Guadeloupe, Martinique, Guyane, La Réunion, Mayotte), avec un conseil départemental.</li>
              <li><strong>18 régions</strong> : 13 en métropole depuis le 1<sup>er</sup> janvier 2016 (loi du 16 janvier 2015), et 5 régions d'outre-mer.</li>
              <li>Des collectivités d'outre-mer à statut particulier (Polynésie française, Nouvelle-Calédonie, Saint-Pierre-et-Miquelon…).</li>
            </ul>
          </div>
          <div class="col">
            <ul>
              <li>Le préfet représente l'État dans le département et la région.</li>
              <li>Population : environ <strong>68,6 millions</strong> d'habitants au 1<sup>er</sup> janvier 2025 (INSEE).</li>
              <li>Capitale : Paris. Fleuves : Loire, Seine, Rhône, Garonne, Rhin (frontalier).</li>
              <li>Pays frontaliers en Europe : Belgique, Luxembourg, Allemagne, Suisse, Italie, Monaco, Espagne, Andorre (et le Brésil, le Suriname en Guyane).</li>
            </ul>
          </div>
        </div>
        <aside class="notes">
          Loi n° 2015-29 du 16 janvier 2015 relative à la délimitation des régions (13 régions métropolitaines au 1er janvier 2016). Régions d'outre-mer : Guadeloupe, Martinique, Guyane, La Réunion, Mayotte (Mayotte est département et région depuis 2011).
          Nombre de communes : 34 935 au 1er janvier 2025 selon l'INSEE (Code officiel géographique) — « environ 35 000 ».
          Population : INSEE, bilan démographique 2024 (68,6 millions au 1er janvier 2025, France entière hors Mayotte : 68,3 ; avec Mayotte 68,6). Chiffre à actualiser chaque janvier.
        </aside>
      </section>

      <!-- 10 · histoire 1 -->
      <section data-ref="Livret du citoyen ; Légifrance (textes cités)">
        <div class="kicker">Connaissances · l'histoire (1/2)</div>
        <h2>De la Révolution à 1905 : les dates que l'on attend.</h2>
        <table>
          <tr><th>Date</th><th>Événement</th></tr>
          <tr><td><strong>14 juillet 1789</strong></td><td>Prise de la Bastille ; début de la Révolution française.</td></tr>
          <tr><td><strong>26 août 1789</strong></td><td>Déclaration des droits de l'homme et du citoyen (art. 1<sup>er</sup> : « Les hommes naissent et demeurent libres et égaux en droits »).</td></tr>
          <tr><td><strong>1792</strong></td><td>Proclamation de la I<sup>re</sup> République (21 septembre).</td></tr>
          <tr><td><strong>1804</strong></td><td>Code civil (« Code Napoléon ») ; Napoléon Bonaparte devient empereur.</td></tr>
          <tr><td><strong>1848</strong></td><td>II<sup>e</sup> République ; suffrage universel masculin ; abolition définitive de l'esclavage (décret du 27 avril 1848, Victor Schœlcher).</td></tr>
          <tr><td><strong>1870</strong></td><td>Proclamation de la III<sup>e</sup> République (4 septembre).</td></tr>
          <tr><td><strong>1881–1882</strong></td><td>Lois Jules Ferry : école primaire gratuite (1881), obligatoire et laïque (1882).</td></tr>
          <tr><td><strong>9 décembre 1905</strong></td><td>Loi de séparation des Églises et de l'État.</td></tr>
        </table>
        <aside class="notes">
          Textes : Déclaration des droits de l'homme et du citoyen du 26 août 1789 (Légifrance) ; décret du 27 avril 1848 relatif à l'abolition de l'esclavage dans les colonies ; loi du 16 juin 1881 (gratuité) et loi du 28 mars 1882 (obligation, laïcité de l'enseignement primaire public) ; loi du 9 décembre 1905.
          Une première abolition de l'esclavage avait été votée par la Convention le 4 février 1794, puis rétablie en 1802.
        </aside>
      </section>

      <!-- 11 · histoire 2 -->
      <section data-ref="Légifrance (textes cités) ; vie-publique.fr">
        <div class="kicker">Connaissances · l'histoire (2/2)</div>
        <h2>Le XX<sup>e</sup> siècle et aujourd'hui.</h2>
        <table>
          <tr><th>Date</th><th>Événement</th></tr>
          <tr><td><strong>1914–1918</strong></td><td>Première Guerre mondiale ; armistice du 11 novembre 1918.</td></tr>
          <tr><td><strong>18 juin 1940</strong></td><td>Appel du général de Gaulle depuis Londres ; Résistance ; Libération en 1944.</td></tr>
          <tr><td><strong>21 avril 1944</strong></td><td>Ordonnance accordant le droit de vote aux femmes ; premier vote aux municipales du 29 avril 1945.</td></tr>
          <tr><td><strong>1945</strong></td><td>Création de la Sécurité sociale (ordonnances des 4 et 19 octobre 1945).</td></tr>
          <tr><td><strong>4 octobre 1958</strong></td><td>Constitution de la V<sup>e</sup> République (Charles de Gaulle, premier président en 1959).</td></tr>
          <tr><td><strong>1962</strong></td><td>Élection du Président au suffrage universel direct (référendum du 28 octobre) ; fin de la guerre d'Algérie (accords d'Évian, 18 mars).</td></tr>
          <tr><td><strong>17 janvier 1975</strong></td><td>Loi Veil dépénalisant l'interruption volontaire de grossesse.</td></tr>
          <tr><td><strong>9 octobre 1981</strong></td><td>Abolition de la peine de mort (loi Badinter).</td></tr>
          <tr><td><strong>17 mai 2013</strong></td><td>Ouverture du mariage aux couples de même sexe.</td></tr>
          <tr><td><strong>8 mars 2024</strong></td><td>La liberté de recourir à l'IVG inscrite dans la Constitution (art. 34).</td></tr>
        </table>
        <aside class="notes">
          Ordonnance du 21 avril 1944 portant organisation des pouvoirs publics en France après la Libération, art. 17 (« Les femmes sont électrices et éligibles dans les mêmes conditions que les hommes »).
          Ordonnances n° 45-2250 du 4 octobre 1945 et n° 45-2454 du 19 octobre 1945 (Sécurité sociale).
          Loi n° 75-17 du 17 janvier 1975 (IVG) ; loi n° 81-908 du 9 octobre 1981 (abolition de la peine de mort) ; loi n° 2013-404 du 17 mai 2013 (mariage) ; loi constitutionnelle n° 2024-200 du 8 mars 2024 relative à la liberté de recourir à l'interruption volontaire de grossesse.
          Référendum du 28 octobre 1962 et loi constitutionnelle du 6 novembre 1962.
        </aside>
      </section>

      <!-- 12 · Europe et monde -->
      <section data-ref="Traité de Rome (1957) ; europa.eu ; vie-publique.fr">
        <div class="kicker">Connaissances · la France dans le monde</div>
        <h2>L'Europe et les relations internationales.</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li>Membre <strong>fondateur</strong> de la construction européenne : CECA (1951), traité de Rome (<strong>25 mars 1957</strong>) créant la CEE ; Union européenne depuis le traité de Maastricht (1992).</li>
              <li><strong>L'euro</strong> : monnaie unique (pièces et billets depuis le 1<sup>er</sup> janvier 2002) ; la Banque centrale européenne est à Francfort.</li>
              <li><strong>Espace Schengen</strong> : libre circulation sans contrôle aux frontières intérieures (accord de 1985, appliqué depuis 1995).</li>
              <li>Le Parlement européen siège à <strong>Strasbourg</strong> ; les députés européens sont élus tous les 5 ans.</li>
            </ul>
          </div>
          <div class="col">
            <ul>
              <li>La France est l'un des <strong>5 membres permanents</strong> du Conseil de sécurité de l'ONU.</li>
              <li>Membre de l'OTAN, du G7, de l'OCDE, du Conseil de l'Europe (siège à Strasbourg).</li>
              <li>La <strong>francophonie</strong> : le français est parlé sur les cinq continents ; l'Organisation internationale de la Francophonie regroupe plusieurs dizaines d'États et gouvernements.</li>
              <li>Devise commune de l'UE : « Unie dans la diversité » ; drapeau à douze étoiles.</li>
            </ul>
          </div>
        </div>
        <aside class="notes">
          Traité instituant la Communauté économique européenne, signé à Rome le 25 mars 1957 ; traité sur l'Union européenne signé à Maastricht le 7 février 1992 ; convention d'application de l'accord de Schengen (1990), entrée en vigueur le 26 mars 1995 ; euro fiduciaire au 1er janvier 2002 (l'euro scriptural date du 1er janvier 1999).
          Charte des Nations unies, art. 23 (membres permanents du Conseil de sécurité).
        </aside>
      </section>

      <!-- 13 · droits et devoirs -->
      <section data-ref="Charte des droits et devoirs ; Code électoral ; Code du service national (art. L114-1 et s.) ; Code de l'éducation art. L131-1">
        <div class="kicker">Connaissances · droits et devoirs</div>
        <h2>Ce que la nationalité donne, et ce qu'elle demande.</h2>
        <div class="cols">
          <div class="col">
            <h3>Des droits</h3>
            <ul>
              <li><strong>Voter</strong> et être élu·e à toutes les élections (à partir de 18 ans) ; inscription d'office sur les listes électorales après la naturalisation.</li>
              <li>Accéder à tous les emplois publics, y compris ceux réservés aux nationaux.</li>
              <li>Un passeport et une carte d'identité français ; la protection consulaire ; la libre circulation dans l'UE.</li>
              <li>Transmettre la nationalité à ses enfants.</li>
            </ul>
          </div>
          <div class="col">
            <h3>Des devoirs</h3>
            <ul>
              <li>Respecter les <strong>lois</strong> et les valeurs de la République.</li>
              <li>Contribuer aux charges publiques : payer ses <strong>impôts</strong>.</li>
              <li>Participer à la <strong>défense</strong> : recensement et journée défense et citoyenneté pour les jeunes (16–25 ans), y compris naturalisés.</li>
              <li>Être <strong>juré</strong> en cour d'assises si l'on est tiré au sort.</li>
              <li>Faire instruire ses enfants : instruction obligatoire de <strong>3 à 16 ans</strong>.</li>
            </ul>
          </div>
        </div>
        <p class="cite">La France admet la plurinationalité : acquérir la nationalité française n'oblige pas à renoncer à la sienne (sous réserve du droit de l'autre pays).</p>
        <aside class="notes">
          Charte des droits et devoirs du citoyen français (décret n° 2012-127).
          Inscription d'office sur les listes électorales des personnes ayant acquis la nationalité française : Code électoral, art. L. 11 (répertoire électoral unique, loi n° 2016-1048).
          Journée défense et citoyenneté : Code du service national, art. L. 114-1 et suivants (recensement à 16 ans ; les personnes acquérant la nationalité entre 16 et 25 ans sont soumises aux mêmes obligations).
          Instruction obligatoire de 3 à 16 ans : Code de l'éducation, art. L. 131-1 (loi n° 2019-791 du 26 juillet 2019 pour une école de la confiance).
          Plurinationalité : la France n'exige pas la renonciation à la nationalité d'origine (pas de disposition contraire dans le Code civil ; voir service-public.fr « Double nationalité »).
        </aside>
      </section>

      <!-- 14 · questions fréquentes -->
      <section data-ref="Livret du citoyen ; retours d'expérience (non normatif)">
        <div class="kicker">S'entraîner</div>
        <h2>Des questions fréquentes, pour répondre en deux phrases.</h2>
        <div class="cols">
          <div class="col">
            <ul>
              <li><span class="q">Que signifie la laïcité pour vous ?</span></li>
              <li><span class="q">Citez trois symboles de la République.</span></li>
              <li><span class="q">Qui est le Président ? Le Premier ministre ? Votre maire ?</span></li>
              <li><span class="q">Que s'est-il passé le 14 juillet 1789 ?</span></li>
              <li><span class="q">Combien y a-t-il de régions, de départements ?</span></li>
              <li><span class="q">Quels sont vos devoirs de citoyen ?</span></li>
            </ul>
          </div>
          <div class="col">
            <ul>
              <li><span class="q">Que pensez-vous de l'égalité entre les femmes et les hommes ?</span></li>
              <li><span class="q">Citez un écrivain, un scientifique, un monument français.</span></li>
              <li><span class="q">Quelle est la devise de la République ? D'où vient-elle ?</span></li>
              <li><span class="q">Que ferez-vous une fois français·e ?</span></li>
              <li><span class="q">Que retenez-vous de la Charte que vous allez signer ?</span></li>
            </ul>
          </div>
        </div>
        <div class="card" style="margin-top:12px;">
          <p><strong>Méthode.</strong> Une réponse courte, exacte, puis un exemple personnel. On attend moins un cours d'histoire qu'une preuve que vous comprenez la société dans laquelle vous vivez et que vous en partagez les principes. Les noms des responsables politiques changent : vérifiez-les la veille.</p>
        </div>
        <aside class="notes">
          Les questions listées reflètent les thèmes du Livret du citoyen (symboles, histoire, institutions, valeurs, droits et devoirs) et ne constituent pas une liste officielle. Les noms des titulaires de fonctions (président, Premier ministre, ministres, maire) doivent être vérifiés au moment de l'entretien.
        </aside>
      </section>

      <!-- 15 · après -->
      <section data-ref="Code civil art. 21-28 ; décret 93-1362 ; service-public.fr">
        <div class="kicker">Et ensuite</div>
        <h2>Après le décret : l'accueil dans la citoyenneté.</h2>
        <ul>
          <li>Le décret de naturalisation est publié au <strong>Journal officiel</strong> ; la préfecture vous en informe et vous remet une ampliation du décret.</li>
          <li>Vous êtes invité·e à une <strong>cérémonie d'accueil dans la citoyenneté française</strong>, organisée dans les six mois par le préfet (ou le maire), au cours de laquelle sont rappelés les droits et devoirs du citoyen (C. civ. art. 21-28).</li>
          <li>Vous pouvez ensuite demander une carte nationale d'identité et un passeport, et vous êtes inscrit·e d'office sur les listes électorales.</li>
          <li>Vos enfants mineurs qui résident habituellement avec vous deviennent français en même temps que vous s'ils sont mentionnés dans le décret (C. civ. art. 22-1).</li>
        </ul>
        <div class="card" style="margin-top:12px;">
          <h3>Un mot sur la francisation du nom</h3>
          <p>Lors de la demande, vous pouvez demander la <strong>francisation</strong> de votre nom ou de vos prénoms (loi n° 72-964 du 25 octobre 1972). C'est facultatif.</p>
        </div>
        <aside class="notes">
          Code civil, art. 21-28 : cérémonie d'accueil dans la citoyenneté française organisée par le représentant de l'État dans le département, dans un délai de six mois à compter de l'acquisition de la nationalité ; art. 22-1 (effet collectif pour les enfants mineurs).
          Loi n° 72-964 du 25 octobre 1972 relative à la francisation des noms et prénoms des personnes qui acquièrent ou recouvrent la nationalité française.
        </aside>
      </section>

      <!-- 16 · ressources -->
      <section class="break" data-ref="ressources officielles">
        <p class="big">Préparez-vous avec les sources officielles.</p>
        <p class="sub">Le <strong>Livret du citoyen</strong> (ministère de l'Intérieur) résume ce que l'entretien attend. <strong>service-public.fr</strong> décrit la procédure à jour ; <strong>vie-publique.fr</strong> explique les institutions ; <strong>legifrance.gouv.fr</strong> donne le texte des lois. Lisez la Charte avant de la signer.</p>
        <aside class="notes">
          Livret du citoyen : publié par la Direction générale des étrangers en France (ministère de l'Intérieur), téléchargeable sur immigration.interieur.gouv.fr.
          Fiche service-public.fr F2213 « Naturalisation » ; vie-publique.fr (Découverte des institutions) ; Légifrance.
        </aside>
      </section>

      <!-- 17 · références -->
      <section data-ref="références" data-visibility="uncounted">
        <div class="kicker">Références</div>

              <li>Ordonnance du 21 avril 1944 ; ordonnances des 4 et 19 octobre 1945.</li>
